[project]
name = "pulse-queue"
version = "0.1.0"
description = "A lightweight, zero-dependency SQLite WAL-backed asyncio task queue with fencing tokens and DLQ replay."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Abhignan Rakshith", email = "abhignanrakshith@icloud.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/abhignan-rakshith/pulse-queue"
Repository = "https://github.com/abhignan-rakshith/pulse-queue"
Issues = "https://github.com/abhignan-rakshith/pulse-queue/issues"

[project.scripts]
pulse-queue = "pulse_queue.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: spawns real subprocesses; deselect with -m 'not integration'",
]
addopts = "-q --strict-markers --doctest-modules"

# Pinned so `uv run ruff check .` reports the same rules on every machine,
# including CI. Without this, results depend on a developer's personal config.
[tool.ruff.lint]
select = ["E", "F", "W"]
